[workspace]
resolver = "3"
members = [
    "crates/vkxp-proto",
    "crates/vkxp-pixel",
    "crates/vkxp-core",
    "crates/vkxp-image",
    "crates/vkxp-text",
    "crates/vkxp-vfs",
    "crates/vkxp-ruby-sys",
    "crates/vkxp-ruby192-sys",
    "crates/vkxp-binding",
    "crates/vkxp-guest",
    "crates/vkxp-guest-main",
    "crates/vkxp-compose-ref",
    "crates/vkxp-vk",
    "crates/vkxp-audio",
    "crates/vkxp-host",
    "crates/vkxp",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Yanwen Xu"]
repository = "https://github.com/xuyanwen2012/vkxp"
homepage = "https://github.com/xuyanwen2012/vkxp"
readme = "README.md"
keywords = ["rpg-maker", "rgss", "vulkan", "game-engine", "emulation"]
categories = ["game-engines", "emulators"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

# Development and test builds: debug assertions and overflow checks stay on, as `dev` has
# them, and `test` inherits from `dev`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
vkxp-proto = { path = "crates/vkxp-proto" }
vkxp-pixel = { path = "crates/vkxp-pixel" }
vkxp-core = { path = "crates/vkxp-core" }
vkxp-image = { path = "crates/vkxp-image" }
vkxp-text = { path = "crates/vkxp-text" }
vkxp-vfs = { path = "crates/vkxp-vfs" }
vkxp-ruby-sys = { path = "crates/vkxp-ruby-sys" }
vkxp-binding = { path = "crates/vkxp-binding" }
vkxp-guest = { path = "crates/vkxp-guest" }
vkxp-guest-main = { path = "crates/vkxp-guest-main" }
vkxp-compose-ref = { path = "crates/vkxp-compose-ref" }
vkxp-vk = { path = "crates/vkxp-vk" }
vkxp-audio = { path = "crates/vkxp-audio" }
vkxp-host = { path = "crates/vkxp-host" }

anyhow = "1"
ash = "0.38"
ash-window = "0.13"
cc = "1"
cpal = "0.18"
encoding_rs = "0.8"
flate2 = "1"
fontdb = "0.24"
gilrs = "0.11"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
landlock = "0.4"
libc = "0.2"
libm = { version = "0.2", default-features = false }
libz-sys = { version = "1.1", default-features = false, features = ["static"] }
png = "0.18"
postcard = { version = "1", default-features = false, features = ["alloc"] }
proptest = "1"
raw-window-handle = "0.6"
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
swash = "0.2"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "mp2", "mp3", "id3v2"] }
tempfile = "3"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
winit = "0.30"
x11rb = "0.14"
