[workspace]
resolver = "3"
members = [
    "crates/vkrgss-proto",
    "crates/vkrgss-pixel",
    "crates/vkrgss-core",
    "crates/vkrgss-image",
    "crates/vkrgss-text",
    "crates/vkrgss-vfs",
    "crates/vkrgss-ruby-sys",
    "crates/vkrgss-ruby192-sys",
    "crates/vkrgss-binding",
    "crates/vkrgss-binding-rgss3",
    "crates/vkrgss-guest",
    "crates/vkrgss-guest-main",
    "crates/vkrgss-guest-main-rgss3",
    "crates/vkrgss-guest-rgss12",
    "crates/vkrgss-guest-rgss3",
    "crates/vkrgss-compose-ref",
    "crates/vkrgss-vk",
    "crates/vkrgss-audio",
    "crates/vkrgss-host",
    "crates/vkrgss",
    "crates/vkrgss-android",
    "xtask",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Yanwen Xu"]
repository = "https://github.com/xuyanwen2012/vkrgss-rs"
homepage = "https://github.com/xuyanwen2012/vkrgss-rs"
readme = "README.md"
keywords = ["rpg-maker", "rgss", "vulkan", "game-engine", "emulation"]
categories = ["game-engines", "emulators"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
# Set by the build scripts of the packages over Ruby 1.9.2 for a target without it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(vkrgss_interpreter_absent)', 'cfg(vkrgss_ruby_19)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

# Development and test builds: debug assertions and overflow checks stay on, as `dev` has
# them, and `test` inherits from `dev`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
vkrgss-proto = { path = "crates/vkrgss-proto" }
vkrgss-pixel = { path = "crates/vkrgss-pixel" }
vkrgss-core = { path = "crates/vkrgss-core" }
vkrgss-image = { path = "crates/vkrgss-image" }
vkrgss-text = { path = "crates/vkrgss-text" }
vkrgss-vfs = { path = "crates/vkrgss-vfs" }
vkrgss-ruby-sys = { path = "crates/vkrgss-ruby-sys" }
vkrgss-binding = { path = "crates/vkrgss-binding" }
vkrgss-binding-rgss3 = { path = "crates/vkrgss-binding-rgss3" }
vkrgss-guest = { path = "crates/vkrgss-guest" }
vkrgss-guest-main = { path = "crates/vkrgss-guest-main" }
vkrgss-guest-main-rgss3 = { path = "crates/vkrgss-guest-main-rgss3" }
vkrgss-compose-ref = { path = "crates/vkrgss-compose-ref" }
vkrgss-vk = { path = "crates/vkrgss-vk" }
vkrgss-audio = { path = "crates/vkrgss-audio" }
vkrgss-host = { path = "crates/vkrgss-host" }

anyhow = "1"
ash = "0.38"
ash-window = "0.13"
cc = "1"
cpal = "0.18"
encoding_rs = "0.8"
flate2 = "1"
fontdb = "0.24"
gilrs = "0.11"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
landlock = "0.4"
libc = "0.2"
libm = { version = "0.2", default-features = false }
libz-sys = { version = "1.1", default-features = false, features = ["static"] }
png = "0.18"
postcard = { version = "1", default-features = false, features = ["alloc"] }
proptest = "1"
raw-window-handle = "0.6"
regex-lite = "0.1"
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
skrifa = "0.44"
swash = "0.2"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "mp2", "mp3", "id3v2"] }
tempfile = "3"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
winit = "0.30"
x11rb = "0.14"
