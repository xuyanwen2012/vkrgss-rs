[package]
name = "vkxp"
description = "Rust + Vulkan runtime for RPG Maker XP (RGSS1) games"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
vkxp-binding.workspace = true
vkxp-core.workspace = true
vkxp-guest.workspace = true
vkxp-host.workspace = true
vkxp-proto.workspace = true
vkxp-ruby-sys.workspace = true
vkxp-text.workspace = true
vkxp-vfs.workspace = true

[dev-dependencies]
# The end-to-end test asks the kernel itself whether a process can confine itself here.
landlock.workspace = true
png.workspace = true
tempfile.workspace = true
# The tests of the host's reporter write through the line format of the subscriber.
tracing-subscriber.workspace = true
# The end-to-end test assembles its games with the binding's test support.
vkxp-binding = { workspace = true, features = ["testing"] }
