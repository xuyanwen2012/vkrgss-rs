[package]
name = "vkxp-binding"
description = "RGSS Ruby API for vkxp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test harness of `vkxp_binding::testing`: an interpreter with this binding installed over
# a generated game directory.
testing = ["dep:png"]

[dependencies]
encoding_rs.workspace = true
png = { workspace = true, optional = true }
thiserror.workspace = true
# The reference compositor draws the scene for `Graphics.snap_to_bitmap`, and in the tests of
# the scene classes.
vkxp-compose-ref.workspace = true
vkxp-core.workspace = true
vkxp-image.workspace = true
vkxp-proto.workspace = true
vkxp-ruby-sys.workspace = true
vkxp-vfs.workspace = true

[dev-dependencies]
# The crate's own tests use its harness.
vkxp-binding = { workspace = true, features = ["testing"] }
