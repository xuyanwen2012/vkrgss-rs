[package]
name = "vkrgss-binding"
description = "RGSS Ruby API for vkrgss"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test harness of `vkrgss_binding::testing`: an interpreter with this binding installed over
# a generated game directory.
testing = ["dep:png"]

[dependencies]
encoding_rs.workspace = true
libc.workspace = true
png = { workspace = true, optional = true }
thiserror.workspace = true
# The reference compositor draws the scene for `Graphics.snap_to_bitmap`, and in the tests of
# the scene classes.
vkrgss-compose-ref.workspace = true
vkrgss-core.workspace = true
vkrgss-image.workspace = true
vkrgss-proto.workspace = true
vkrgss-ruby-sys.workspace = true
vkrgss-vfs.workspace = true

[dev-dependencies]
# The crate's own tests use its harness.
vkrgss-binding = { workspace = true, features = ["testing"] }
