[package]
name = "vkrgss-android"
description = "The Android app of vkrgss: the native library of an APK with NativeActivity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The native library the activity loads; `lib` for the tests of the parts that are not
# Android's.
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vkrgss-binding.workspace = true
vkrgss-guest.workspace = true
vkrgss-guest-main.workspace = true
vkrgss-host.workspace = true
vkrgss-proto.workspace = true
vkrgss-text.workspace = true
vkrgss-vfs.workspace = true
vkrgss-vk.workspace = true
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
