[package]
name = "vkxp-host"
description = "Event loop and orchestration for vkxp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test doubles (`testing`) and the demo guest (`demo`). The crate's own tests and examples
# enable it through the development dependency below; the executable does not.
testing = []

[dependencies]
gilrs.workspace = true
png.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
vkxp-audio.workspace = true
vkxp-proto.workspace = true
vkxp-vk.workspace = true
# `serde` reads the names of key codes in a configuration.
winit = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true
vkxp-compose-ref.workspace = true
# The crate itself with its test doubles, for the integration tests and the examples.
vkxp-host = { path = ".", features = ["testing"] }
