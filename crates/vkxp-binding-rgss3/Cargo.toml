[package]
name = "vkxp-binding-rgss3"
description = "RGSS Ruby API for vkxp over Ruby 1.9.2: the source of vkxp-binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
build = "build.rs"

# The one source of the RGSS classes, compiled here over the second interpreter. The
# documentation and its examples belong to `vkxp-binding`.
[lib]
path = "../vkxp-binding/src/lib.rs"
doc = false
doctest = false

[lints]
workspace = true

[features]
# As in `vkxp-binding`.
testing = ["dep:png"]

# The dependencies of `vkxp-binding`, with the interpreter crate replaced; a test of `xtask`
# compares the two lists.
[dependencies]
encoding_rs.workspace = true
png = { workspace = true, optional = true }
thiserror.workspace = true
vkxp-compose-ref.workspace = true
vkxp-core.workspace = true
vkxp-image.workspace = true
vkxp-proto.workspace = true
# The key stays `vkxp-ruby-sys`, so that the source goes on saying `vkxp_ruby_sys::`.
vkxp-ruby-sys = { package = "vkxp-ruby192-sys", path = "../vkxp-ruby192-sys" }
vkxp-vfs.workspace = true

[dev-dependencies]
# The crate's own tests use its harness.
vkxp-binding-rgss3 = { workspace = true, features = ["testing"] }
