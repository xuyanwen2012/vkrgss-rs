name: Nightly

# The checks outside the merge gate that docs/development.md describes, once a day and when
# started by hand. No pull request waits for this workflow, so its failure does not block
# merging. Each check is a job of its own, so that one that fails does not hide the others.
# The last job opens an issue when one of them failed.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The dependency audit against the advisory database, which it downloads.
  audit:
    runs-on: ubuntu-24.04
    # The compiler of the vendored C code, named so that a new default of the runner image
    # does not change it unnoticed.
    env:
      CC: gcc-13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Installs the toolchain that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Dependency audit
        run: cargo xtask audit

  # The tests under collector stress. The first step needs clang with its sanitizer
  # runtimes, the others the prerequisites of the gate and lavapipe.
  stress:
    runs-on: ubuntu-24.04
    # The compiler of the vendored C code, named so that a new default of the runner image
    # does not change it unnoticed.
    env:
      CC: gcc-13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The packages docs/building.md names, and clang with its sanitizer runtimes.
      - name: Install the prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gcc-13 libcrypt-dev glslc spirv-tools libasound2-dev libudev-dev \
            mesa-vulkan-drivers vulkan-validationlayers clang libclang-rt-dev
      # Installs the toolchain that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Collector stress
        run: VK_LOADER_DRIVERS_SELECT='*lvp*' cargo xtask stress

  # The upstream Ruby suites of Ruby 1.8.7 under AddressSanitizer and
  # UndefinedBehaviorSanitizer.
  sanitized:
    runs-on: ubuntu-24.04
    # The compiler of the vendored C code, named so that a new default of the runner image
    # does not change it unnoticed.
    env:
      CC: gcc-13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gcc-13 libcrypt-dev clang libclang-rt-dev
      # Installs the toolchain that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Sanitized suites
        run: cargo test -p vkrgss-ruby-sys --locked --test sanitized -- --ignored upstream_suites_pass_under_the_sanitizers

  # The upstream Ruby suites of Ruby 1.9.2 under AddressSanitizer and
  # UndefinedBehaviorSanitizer.
  sanitized192:
    runs-on: ubuntu-24.04
    # The compiler of the vendored C code, named so that a new default of the runner image
    # does not change it unnoticed.
    env:
      CC: gcc-13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gcc-13 libcrypt-dev clang libclang-rt-dev
      # Installs the toolchain that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Sanitized suites of Ruby 1.9.2
        run: cargo test -p vkrgss-ruby192-sys --locked --test sanitized -- --ignored upstream_suites_pass_under_the_sanitizers

  # A short run of each fuzz target; the corpus is not kept between runs, the inputs put
  # aside are uploaded when the job fails.
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [marshal, parse, regex, marshal192, parse192, regex192]
    # The compiler of the vendored C code, named so that a new default of the runner image
    # does not change it unnoticed.
    env:
      CC: gcc-13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # clang with its sanitizer runtimes and libFuzzer.
      - name: Install the prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gcc-13 libcrypt-dev clang libclang-rt-dev
      # Installs the toolchain that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fuzz target
        run: cargo xtask fuzz ${{ matrix.target }} --seconds 300
      # The inputs the target put aside: the one of a finding, and those of the limits.
      - name: Keep the inputs of the target
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: target/tmp/fuzz/${{ matrix.target }}/artifacts/
          retention-days: 30

  # When a job above failed: opens the issue "Nightly checks failed" with the link to the
  # run, or comments on it while it is open. The only job that may write issues.
  issue:
    needs: [audit, stress, sanitized, sanitized192, fuzz]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or comment on the issue
        run: |
          title="Nightly checks failed"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body="The nightly run $RUN_URL failed."
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
