name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The merge gate in parts, `cargo xtask gate --job <part>`, one job for each so that they
  # run in parallel; together they are the whole gate (docs/development.md). The jobs differ
  # only in the part that they run. sccache keeps the objects of Rust and, as the cc crate
  # puts the wrapper of rustc in front of the C compiler too, those of C, so that the
  # interpreters are not compiled again while their sources stay the same.
  lint:
    runs-on: ubuntu-24.04
    # The compiler of the vendored C code, named so that a new default of the runner image
    # does not change it unnoticed.
    env:
      CC: gcc-13
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages docs/building.md names.
      - name: Install the prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gcc-13 libcrypt-dev glslc spirv-tools libasound2-dev libudev-dev \
            mesa-vulkan-drivers vulkan-validationlayers
      # Installs the toolchain that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: rustup show
      # Before the first command that starts rustc through RUSTC_WRAPPER.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.2
      # The tests render with Vulkan on lavapipe, the software rasteriser of Mesa.
      - name: Merge gate
        run: VK_LOADER_DRIVERS_SELECT='*lvp*' cargo xtask gate --job lint

