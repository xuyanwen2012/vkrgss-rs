name: Release

# A tag v<version> builds the package and publishes the GitHub release. Started by hand,
# the workflow only builds the package and keeps it as an artifact. When the repository has
# the signing secrets of Android (docs/building.md), the release APK is built and attached
# too; without them it is left out with a notice.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    # The compiler of the vendored C code, named so that a new default of the runner image
    # does not change it unnoticed.
    env:
      CC: gcc-13
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages docs/building.md names.
      - name: Install the prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential gcc-13 libcrypt-dev glslc spirv-tools libasound2-dev libudev-dev \
            mesa-vulkan-drivers vulkan-validationlayers
      # Installs the toolchain that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Read the version of the workspace
        id: version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq --raw-output '.packages[] | select(.name == "vkrgss") | .version')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the tag is the version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version of the workspace"
            exit 1
          fi
      - name: Build the package
        run: cargo xtask dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vkrgss-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu
          path: |
            target/dist/*.tar.gz
            target/dist/*.tar.gz.sha256
          if-no-files-found: error
      # The release APK, signed with the key of the secrets: the keystore is a base64
      # secret written to a temporary file, the passwords stay in the environment.
      - name: Build the Android APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.VKRGSS_ANDROID_KEYSTORE_BASE64 }}
          VKRGSS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VKRGSS_ANDROID_KEYSTORE_PASSWORD }}
          VKRGSS_ANDROID_KEY_ALIAS: ${{ secrets.VKRGSS_ANDROID_KEY_ALIAS }}
          VKRGSS_ANDROID_KEY_PASSWORD: ${{ secrets.VKRGSS_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::the repository has no signing secrets of Android; the release has no APK"
            exit 0
          fi
          # The NDK that docs/building.md names, the build tools and the platform of the APK.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;30.0.16248370" "build-tools;37.0.0" "platforms;android-34" > /dev/null
          rustup target add aarch64-linux-android
          export VKRGSS_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$VKRGSS_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$VKRGSS_ANDROID_KEYSTORE"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" cargo xtask apk --release
          test -f "target/apk/vkrgss-$VERSION-android-arm64.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vkrgss-${{ steps.version.outputs.version }}-android-arm64
          path: |
            target/apk/*-android-arm64.apk
            target/apk/*-android-arm64.apk.sha256
          if-no-files-found: ignore
      # Only a pushed tag publishes: a run started by hand on a tag only builds.
      - name: Create the release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The section of this version in the changelog, without its heading.
          awk -v heading="## [$VERSION]" '
            index($0, "## [") == 1 { inside = index($0, heading) == 1; next }
            inside
          ' CHANGELOG.md > target/dist/notes.md
          grep --quiet '[^[:space:]]' target/dist/notes.md || {
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          }
          cat >> target/dist/notes.md <<'NOTES'

          ### Requirements

          The package is built for Linux x86_64 on Ubuntu 24.04 and needs glibc 2.39 or
          newer. At run time it needs the Vulkan loader with a Vulkan 1.3 driver, ALSA
          (`libasound.so.2`) and libudev (`libudev.so.1`).
          Check the download with `sha256sum -c vkrgss-*.tar.gz.sha256`.
          NOTES
          assets=(target/dist/*.tar.gz target/dist/*.tar.gz.sha256)
          apk="target/apk/vkrgss-$VERSION-android-arm64.apk"
          if [ -f "$apk" ]; then
            assets+=("$apk" "$apk.sha256")
            cat >> target/dist/notes.md <<'NOTES'

          The APK is for Android 14 or later on arm64 with Vulkan 1.3, self-signed; Obtainium
          installs it and its updates from this repository's releases (docs/running.md).
          NOTES
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "vkrgss $VERSION" \
            --notes-file target/dist/notes.md "${assets[@]}"
